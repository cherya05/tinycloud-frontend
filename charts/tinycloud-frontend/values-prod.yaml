replicaCount: 1

image:
  repository: cheryyaaaaaaa/tinycloud-frontend
  pullPolicy: Always
  tag: "latest"

resources:
  limits:
    cpu: 50m
    memory: 32Mi
  requests:
    cpu: 10m
    memory: 16Mi

ingress:
  enabled: true
  className: "nginx"
  annotations:
    external-dns.alpha.kubernetes.io/hostname: prod.hatstore-danil.info
  hosts:
    - host: prod.hatstore-danil.info
      paths:
        - path: /
          pathType: Prefix
  tls: []

backend:
  serviceName: tinycloud-app-prod-tinycloud-backend
  servicePort: 8080

env:
  BACKEND_HOST: tinycloud-app-prod-tinycloud-backend
  BACKEND_PORT: "8080"