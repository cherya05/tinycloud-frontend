name: Tinycloud Frontend Pipeline
on:
    push:
        branches:
            - main
env:
    AWS_REGION: eu-north-1
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v5
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: ${{ env.AWS_REGION }}
            
            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build and Push Docker image
              run: |
                docker build --no-cache -t tinycloud-frontend:latest .
                docker tag tinycloud-frontend:latest ${{ steps.login-ecr.outputs.registry }}/tinycloud-frontend:${{ github.sha }}
                docker push ${{ steps.login-ecr.outputs.registry }}/tinycloud-frontend:${{ github.sha }}

            - name: Build and Push Helm chart
              run: |
                helm package charts/tinycloud-frontend
                helm push tinycloud-frontend-*.tgz oci://${{ steps.login-ecr.outputs.registry }}